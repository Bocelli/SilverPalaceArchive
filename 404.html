<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Fascicolo non trovato — Silverium Database</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #090B10; color: #E2E8F0;
      font-family: 'Inter', system-ui, sans-serif;
      background-image: radial-gradient(ellipse at top, rgba(212,175,55,.07), transparent 60%);
    }
    .box { max-width: 34rem; padding: 2.5rem; text-align: center; }
    .code { font-family: 'Playfair Display', serif; font-size: 4.5rem; line-height: 1; color: #D4AF37; margin: 0 0 1rem; }
    h1 { font-family: 'Playfair Display', serif; font-size: 1.6rem; margin: 0 0 .75rem; }
    p { color: #8592A6; font-size: .9rem; line-height: 1.6; margin: 0 0 1.75rem; }
    a {
      display: inline-block; padding: .7rem 1.3rem; border-radius: .6rem;
      background: #D4AF37; color: #090B10; font-weight: 600; font-size: .85rem;
      text-decoration: none;
    }
    a:hover { background: #e0bf52; }
  </style>
</head>
<body>
  <main class="box">
    <p class="code">404</p>
    <h1>Fascicolo non trovato</h1>
    <p>L'atto che cercavi non è nell'archivio, oppure è stato spostato in un'altra sezione del database.</p>
    <a href="./">Torna all'archivio</a>
  </main>
</body>
</html>
